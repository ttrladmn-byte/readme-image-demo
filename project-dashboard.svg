<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Project dashboard preview</title>
  <desc id="desc">A polished sample dashboard with three metric cards and an activity chart.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="190" fill="#7c3aed" opacity=".12"/>
  <circle cx="90" cy="590" r="220" fill="#0ea5e9" opacity=".10"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#f8fafc">
    <text x="72" y="88" font-size="42" font-weight="700">Project Dashboard</text>
    <text x="72" y="126" font-size="20" fill="#94a3b8">Live metrics at a glance</text>
  </g>
  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="72" y="174" width="320" height="140" rx="20" fill="#172033" stroke="#334155"/>
    <text x="104" y="218" font-size="18" fill="#94a3b8">Active users</text>
    <text x="104" y="278" font-size="48" font-weight="700" fill="#f8fafc">12,480</text>
    <text x="297" y="278" font-size="18" font-weight="600" fill="#34d399">+18%</text>

    <rect x="440" y="174" width="320" height="140" rx="20" fill="#172033" stroke="#334155"/>
    <text x="472" y="218" font-size="18" fill="#94a3b8">Tasks shipped</text>
    <text x="472" y="278" font-size="48" font-weight="700" fill="#f8fafc">326</text>
    <text x="665" y="278" font-size="18" font-weight="600" fill="#38bdf8">92%</text>

    <rect x="808" y="174" width="320" height="140" rx="20" fill="#172033" stroke="#334155"/>
    <text x="840" y="218" font-size="18" fill="#94a3b8">Uptime</text>
    <text x="840" y="278" font-size="48" font-weight="700" fill="#f8fafc">99.9%</text>
    <circle cx="1082" cy="267" r="9" fill="#34d399"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="72" y="352" width="1056" height="212" rx="22" fill="#172033" stroke="#334155"/>
    <g stroke="#334155" stroke-width="1" opacity=".8">
      <line x1="112" y1="408" x2="1088" y2="408"/>
      <line x1="112" y1="463" x2="1088" y2="463"/>
      <line x1="112" y1="518" x2="1088" y2="518"/>
    </g>
    <path d="M112 505 C190 490, 236 510, 310 468 S430 438, 512 458 S650 472, 728 421 S858 404, 930 430 S1025 390,1088 397" fill="none" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
    <g fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">
      <text x="112" y="390">Weekly activity</text>
      <text x="980" y="540" fill="#94a3b8">Last 7 days</text>
    </g>
  </g>
</svg>
